name: Python tests

on:
  push:
    branches:
      - master
      - codex/**
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest / windows-latest
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Run keyless regression suite
        run: python -m pytest -q
